<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ternary globe</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      background: #05070d;
      color: #d7e2ee;
      font: 16px/1.4 sans-serif;
    }
    main {
      display: inline-block;
      padding: 16px;
    }
    canvas {
      display: block;
      background: #05070d;
    }
    .controls {
      margin: 12px 0 0;
    }
    button {
      font: inherit;
      margin: 0 8px 0 0;
      padding: 8px 14px;
      color: #102033;
      background: #d7e2ee;
      border: 0;
      border-radius: 4px;
    }
    .hint, #readout {
      margin: 8px 0 0;
    }
    #readout {
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <main>
    <canvas id="globe" width="640" height="640"></canvas>
    <p class="controls">
      <button type="button" data-action="turn-left">turn-left</button>
      <button type="button" data-action="advance">advance</button>
      <button type="button" data-action="turn-right">turn-right</button>
    </p>
    <p class="hint">Gold rings travel with the mover. Dashed lines mark collectible troughs. Keys: arrows, Q/E, or Space.</p>
    <p id="readout"></p>
  </main>
  <script src="movement.js"></script>
  <script src="draw.js"></script>
</body>
</html>
